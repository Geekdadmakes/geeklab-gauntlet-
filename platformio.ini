; PlatformIO Project Configuration File for Wearable Tech Pad
; ESP32-WROOM-32 Based Wrist Computer with 2.8" ILI9341 TFT Display

[env:esp32dev]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Build settings with TFT_eSPI configuration
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=19
    -DTFT_MOSI=11
    -DTFT_SCLK=18
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=4
    -DTFT_BL=21
    -DUSE_HSPI_PORT=1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=4000000
    -DSPI_READ_FREQUENCY=4000000
    -DSPI_TOUCH_FREQUENCY=2500000

; Monitor settings
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Library dependencies
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    adafruit/Adafruit BME280 Library@^2.2.4
    mikalhart/TinyGPSPlus@^1.0.3
    adafruit/RTClib@^2.1.4
    https://github.com/rfetick/MPU6050_light.git
    https://github.com/RobTillaart/PCF8574.git
    h2zero/NimBLE-Arduino@^1.4.1
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21.4
    bxparks/AceButton@^1.10.1
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.2

; Upload settings
upload_speed = 921600

; Filesystem settings for config storage
board_build.filesystem = littlefs
board_build.partitions = default.csv

; Power optimization settings
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
